name = "tcaccounts"
main = "worker/index.js"
compatibility_date = "2026-10-25"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "TC"
database_name = "TC"
database_id = "fd0e9d90-b443-4002-8378-f0d817fb415b"

[vars]
APP_ENV = "production"

[previews.vars]
APP_ENV = "preview"

[[previews.d1_databases]]
binding = "TC"
database_name = "TC-preview"
database_id = "f9754f63-67b9-4eb2-bb51-91d860aec9f1"
